        // ===== CONTROLS VISIBILITY - ONLY ON DOUBLE CLICK =====
        function showControls() {
            if (controlsTimeout) clearTimeout(controlsTimeout);
            controlsBar.classList.add('visible');
            controlsBar.classList.remove('fade-out');
            controlsVisible = true;
            controlsTimeout = setTimeout(() => {
                hideControls();
            }, 3000);
        }

        function hideControls() {
            controlsBar.classList.remove('visible');
            controlsBar.classList.add('fade-out');
            controlsVisible = false;
        }

        function toggleControls() {
            if (controlsVisible) {
                hideControls();
            } else {
                showControls();
            }
        }

        // ===== BUILD SPEEDOMETER =====
        function buildSpeedometer() {
            const ticksGroup = document.getElementById('ticks');
            const labelsGroup = document.getElementById('labels');
            
            ticksGroup.innerHTML = '';
            labelsGroup.innerHTML = '';
            
            for (let i = 0; i <= 220; i += 10) {
                const angle = -90 + (i / 220) * 220;
                const rad = (angle - 90) * Math.PI / 180;
                const isMajor = i % 20 === 0;
                const innerRadius = isMajor ? 72 : 76;
                const outerRadius = isMajor ? 82 : 80;
                
                const x1 = 100 + innerRadius * Math.cos(rad);
                const y1 = 100 + innerRadius * Math.sin(rad);
                const x2 = 100 + outerRadius * Math.cos(rad);
                const y2 = 100 + outerRadius * Math.sin(rad);
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('class', isMajor ? 'speedo-tick-major' : 'speedo-tick');
                ticksGroup.appendChild(line);
                
                if (isMajor && i > 0) {
                    const labelAngle = (angle - 90) * Math.PI / 180;
                    const labelRadius = 62;
                    const lx = 100 + labelRadius * Math.cos(labelAngle);
                    const ly = 100 + labelRadius * Math.sin(labelAngle);
                    
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', lx);
                    text.setAttribute('y', ly + 2);
                    text.setAttribute('class', 'speedo-label');
                    text.textContent = i;
                    labelsGroup.appendChild(text);
                }
            }
        }

        // ===== UPDATE SPEEDOMETER WITH ANIMATION =====
        function updateSpeedometer(speed) {
            targetSpeed = Math.min(220, Math.max(0, speed));
            const diff = targetSpeed - currentDisplaySpeed;
            
            let speedFactor = 0.15;
            if (Math.abs(diff) > 50) speedFactor = 0.25;
            else if (Math.abs(diff) > 20) speedFactor = 0.18;
            
            if (Math.abs(diff) > 0.5) {
                currentDisplaySpeed += diff * speedFactor;
            } else {
                currentDisplaySpeed = targetSpeed;
            }
            
            const displayVal = Math.round(currentDisplaySpeed);
            const angle = -90 + (currentDisplaySpeed / 220) * 220;
            
            if (needle) {
                needle.setAttribute('transform', `rotate(${angle},100,100)`);
                if (currentDisplaySpeed > 160) {
                    needle.classList.add('pulse');
                } else {
                    needle.classList.remove('pulse');
                }
            }
            
            if (speedoValue) {
                const oldVal = speedoValue.textContent;
                speedoValue.textContent = displayVal;
                
                if (Math.abs(displayVal - parseInt(oldVal)) > 5) {
                    speedoValue.classList.remove('pop');
                    void speedoValue.offsetWidth;
                    speedoValue.classList.add('pop');
                }
                
                if (displayVal > 160) {
                    speedoValue.style.fill = '#ff3b30';
                } else if (displayVal > 120) {
                    speedoValue.style.fill = '#ff9500';
                } else {
                    speedoValue.style.fill = '#00ff88';
                }
            }
        }

        // ===== UPDATE STORAGE INFO =====
        function updateStorageInfo() {
            if (!isRecording || recordedChunks.length === 0) return;
            const totalSize = recordedChunks.reduce((acc, chunk) => acc + chunk.size, 0);
            const sizeMB = (totalSize / (1024 * 1024)).toFixed(1);
            const duration = Math.floor((Date.now() - recordingStartTime) / 1000);
            const mins = Math.floor(duration / 60);
            const secs = duration % 60;
            storageInfo.textContent = `${sizeMB} MB • ${mins}m ${secs}s`;
        }

        // ===== TTS - KEPT FOR VOICE GUIDANCE =====
        function speakGuidance(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            utterance.lang = 'en-US';
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) || 
                             voices.find(v => v.lang === 'en-US') || 
                             voices[0];
            if (preferred) utterance.voice = preferred;
            window.speechSynthesis.speak(utterance);
        }

        // ===== VOICE RECOGNITION - SILENT & STABLE =====
        let voiceRecognitionActive = false;
        let voiceRecognitionRetries = 0;
        const maxVoiceRetries = 3;
        let voiceRecognitionTimeout = null;
        let isRestartingVoice = false;

        function startVoiceRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                voiceHeardText.textContent = '🔇 Voice unavailable';
                return;
            }

            if (voiceRecognitionActive || isRestartingVoice) {
                return;
            }

            try {
                speechRecognizer = new window.SpeechRecognition();
                speechRecognizer.continuous = false;
                speechRecognizer.interimResults = false;
                speechRecognizer.lang = 'en-US';
                speechRecognizer.maxAlternatives = 1;
                
                if (voiceRecognitionTimeout) {
                    clearTimeout(voiceRecognitionTimeout);
                    voiceRecognitionTimeout = null;
                }

                speechRecognizer.onstart = function() {
                    voiceRecognitionActive = true;
                    voiceRecognitionRetries = 0;
                    voiceHeardText.textContent = '🎤 Listening...';
                };

                speechRecognizer.onresult = function(event) {
                    if (event.results && event.results.length > 0) {
                        const result = event.results[0];
                        if (result.isFinal) {
                            const transcript = result[0].transcript.trim().toLowerCase();
                            if (transcript) {
                                voiceHeardText.textContent = `🗣️ "${transcript}"`;
                                
                                if (transcript.includes('save') || 
                                    transcript.includes('sos') || 
                                    transcript.includes('emergency') ||
                                    transcript.includes('help')) {
                                    triggerEmergency();
                                    if (isRecording) stopRecording();
                                }
                                if (transcript.includes('stop') && isRecording) {
                                    stopRecording();
                                }
                                if (transcript.includes('start') && !isRecording) {
                                    toggleRecording();
                                }
                            }
                        }
                    }
                    restartVoiceRecognition();
                };

                speechRecognizer.onerror = function(event) {
                    console.log('Voice recognition error:', event.error);
                    voiceRecognitionActive = false;
                    
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        voiceHeardText.textContent = '🔇 Voice disabled';
                        return;
                    }
                    
                    voiceRecognitionRetries++;
                    if (voiceRecognitionRetries < maxVoiceRetries) {
                        const delay = Math.min(1000 * voiceRecognitionRetries, 3000);
                        voiceRecognitionTimeout = setTimeout(() => {
                            restartVoiceRecognition();
                        }, delay);
                    } else {
                        voiceHeardText.textContent = '🔇 Voice standby';
                        voiceRecognitionRetries = 0;
                        voiceRecognitionTimeout = setTimeout(() => {
                            restartVoiceRecognition();
                        }, 10000);
                    }
                };

                speechRecognizer.onend = function() {
                    voiceRecognitionActive = false;
                    if (isRecording) {
                        restartVoiceRecognition();
                    } else {
                        voiceHeardText.textContent = '🎤 Say "SAVE"';
                    }
                };

                speechRecognizer.start();
                voiceRecognitionActive = true;
                voiceHeardText.textContent = '🎤 Listening...';
                
                voiceRecognitionTimeout = setTimeout(() => {
                    if (voiceRecognitionActive) {
                        try {
                            speechRecognizer.stop();
                        } catch(e) {}
                        voiceRecognitionActive = false;
                        restartVoiceRecognition();
                    }
                }, 5000);

            } catch (e) {
                console.warn('Voice recognition start error:', e);
                voiceRecognitionActive = false;
                voiceHeardText.textContent = '🔇 Voice standby';
                if (isRecording) {
                    voiceRecognitionTimeout = setTimeout(() => {
                        restartVoiceRecognition();
                    }, 3000);
                }
            }
        }

        function restartVoiceRecognition() {
            if (isRestartingVoice) return;
            if (!isRecording) {
                voiceRecognitionActive = false;
                return;
            }
            
            isRestartingVoice = true;
            
            try {
                if (speechRecognizer) {
                    speechRecognizer.abort();
                    speechRecognizer = null;
                }
            } catch(e) {}
            
            if (voiceRecognitionTimeout) {
                clearTimeout(voiceRecognitionTimeout);
                voiceRecognitionTimeout = null;
            }
            
            voiceRecognitionActive = false;
            
            setTimeout(() => {
                isRestartingVoice = false;
                if (isRecording) {
                    startVoiceRecognition();
                }
            }, 500);
        }

        function stopVoiceRecognition() {
            isRestartingVoice = false;
            voiceRecognitionActive = false;
            
            if (voiceRecognitionTimeout) {
                clearTimeout(voiceRecognitionTimeout);
                voiceRecognitionTimeout = null;
            }
            
            try {
                if (speechRecognizer) {
                    speechRecognizer.abort();
                    speechRecognizer = null;
                }
            } catch(e) {}
            
            voiceHeardText.textContent = '🔇 Voice off';
        }

        // ===== TIME =====
        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateTime, 1000); updateTime();

        // ===== GENERATE POIS =====
        function generatePOIs() {
            speedCameras = [];
            trafficLights = [];
            const positions = [
                { lng: -0.0025, lat: -0.0015, speed: 50 },
                { lng: 0.0025, lat: 0.0015, speed: 60 },
                { lng: -0.0015, lat: 0.0025, speed: 40 },
                { lng: 0.0015, lat: -0.0025, speed: 50 },
                { lng: -0.003, lat: 0.000, speed: 70 },
                { lng: 0.003, lat: 0.000, speed: 60 },
            ];
            positions.forEach((p, i) => {
                speedCameras.push({
                    lng: currentLng + p.lng,
                    lat: currentLat + p.lat,
                    speed: p.speed,
                    id: i
                });
                if (i % 2 === 0) {
                    trafficLights.push({
                        lng: currentLng + p.lng + 0.0005,
                        lat: currentLat + p.lat + 0.0005,
                        state: ['green', 'yellow', 'red'][i % 3]
                    });
                }
            });
        }

        // ===== MAP INIT =====
        function initMap() {
            try {
                const mapStyle = {
                    "version": 8,
                    "sources": {
                        "osm": {
                            "type": "raster",
                            "tiles": [
                                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                            ],
                            "tileSize": 256,
                            "attribution": "© OpenStreetMap"
                        }
                    },
                    "layers": [
                        {
                            "id": "osm-layer",
                            "type": "raster",
                            "source": "osm",
                            "minzoom": 0,
                            "maxzoom": 19
                        }
                    ]
                };

                map = new maplibregl.Map({
                    container: 'map',
                    style: mapStyle,
                    center: [currentLng, currentLat],
                    zoom: 17,
                    pitch: 65,
                    bearing: 0,
                    antialias: true,
                    attributionControl: false,
                    fadeDuration: 0
                });

                mapPlaceholder.style.display = 'none';

                map.on('load', () => {
                    mapReady = true;
                    
                    generatePOIs();
                    addSpeedCameras();
                    addTrafficLights();

                    map.addSource('route', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
                    });

                    map.addLayer({
                        id: 'route-glow',
                        type: 'line',
                        source: 'route',
                        paint: {
                            'line-color': '#3b82f6',
                            'line-width': 20,
                            'line-opacity': 0.12,
                            'line-blur': 14
                        }
                    });

                    map.addLayer({
                        id: 'route-bg',
                        type: 'line',
                        source: 'route',
                        paint: {
                            'line-color': '#1d4ed8',
                            'line-width': 8,
                            'line-opacity': 0.8
                        }
                    });

                    map.addLayer({
                        id: 'route-fg',
                        type: 'line',
                        source: 'route',
                        paint: {
                            'line-color': '#3b82f6',
                            'line-width': 3,
                            'line-opacity': 1
                        }
                    });

                    map.setFog({
                        'range': [0.8, 4],
                        'color': '#0a0f1a',
                        'horizon-blend': 0.3
                    });

                    statusMessage.textContent = '🚗 3D Map Ready';
                });

                const el = document.createElement('div');
                el.style.cssText = 'position:relative;width:24px;height:24px;';
                
                const dot = document.createElement('div');
                dot.style.cssText = 'position:absolute;top:4px;left:4px;width:16px;height:16px;background:#00ff88;border-radius:50%;border:2.5px solid white;box-shadow:0 0 25px rgba(0,255,136,0.4);z-index:2;';
                el.appendChild(dot);
                
                const arrow = document.createElement('div');
                arrow.id = 'directionArrow';
                arrow.style.cssText = 'position:absolute;top:-6px;left:7px;width:10px;height:10px;border-left:3px solid #00ff88;border-top:3px solid #00ff88;transform:rotate(45deg);z-index:1;transition:transform 0.3s;';
                el.appendChild(arrow);
                
                const ring = document.createElement('div');
                ring.style.cssText = 'position:absolute;top:-6px;left:-6px;width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,255,136,0.15);animation:pulse 2s infinite;z-index:0;';
                el.appendChild(ring);

                deviceMarker = new maplibregl.Marker({ element: el }).setLngLat([currentLng, currentLat]).addTo(map);

                console.log('🚗 Map initialized');
            } catch(e) {
                console.error('Map init error:', e);
                statusMessage.textContent = 'Retrying map...';
                setTimeout(initMap, 2000);
            }
        }

        // ===== UPDATE MAP POSITION =====
        function updateMapPosition(lat, lng, heading) {
            if (!map || !deviceMarker || !mapReady) return;
            
            deviceMarker.setLngLat([lng, lat]);
            
            const arrow = document.getElementById('directionArrow');
            if (arrow && heading !== null && heading !== undefined) {
                arrow.style.transform = `rotate(${heading + 45}deg)`;
            }
            
            const options = {
                center: [lng, lat],
                duration: 800,
                easing: function(t) { return t; }
            };
            
            if (!headingLockActive && heading !== null && heading !== undefined) {
                options.bearing = heading;
                options.pitch = 65;
            } else if (headingLockActive) {
                options.bearing = 0;
                options.pitch = 65;
            }
            
            map.easeTo(options);
        }

        // ===== ADD SPEED CAMERAS =====
        function addSpeedCameras() {
            if (!map) return;
            const cameraFeatures = speedCameras.map(c => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
                properties: { type: 'speed_camera', speed: c.speed, label: `📷 ${c.speed}` }
            }));
            
            try {
                map.addSource('cameras', { 
                    type: 'geojson', 
                    data: { type: 'FeatureCollection', features: cameraFeatures } 
                });
                
                map.addLayer({
                    id: 'cameras',
                    type: 'symbol',
                    source: 'cameras',
                    layout: {
                        'icon-image': 'marker-15',
                        'icon-size': 0.5,
                        'text-field': ['get', 'label'],
                        'text-size': 8,
                        'text-offset': [0, 1.2],
                        'text-anchor': 'top'
                    },
                    paint: { 
                        'text-color': '#ff6b6b', 
                        'text-halo-color': '#000', 
                        'text-halo-width': 2 
                    }
                });
            } catch(e) {}
        }

        // ===== ADD TRAFFIC LIGHTS =====
        function addTrafficLights() {
            if (!map) return;
            const lightFeatures = trafficLights.map(l => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [l.lng, l.lat] },
                properties: { type: 'traffic_light', state: l.state }
            }));
            
            try {
                map.addSource('lights', { 
                    type: 'geojson', 
                    data: { type: 'FeatureCollection', features: lightFeatures } 
                });
                
                map.addLayer({
                    id: 'lights',
                    type: 'circle',
                    source: 'lights',
                    paint: {
                        'circle-radius': 6,
                        'circle-color': ['match', ['get', 'state'], 
                            'green', '#00ff88', 
                            'yellow', '#ffdd00', 
                            'red', '#ff3b30', 
                            '#666'
                        ],
                        'circle-stroke-width': 2,
                        'circle-stroke-color': 'rgba(255,255,255,0.5)',
                        'circle-opacity': 0.9
                    }
                });
            } catch(e) {}
        }

        // ===== HEADING LOCK =====
        function toggleHeadingLock() {
            headingLockActive = !headingLockActive;
            if (headingLockActive) {
                headingLockBtn.classList.add('active');
                headingLockBtn.innerHTML = '<i class="fas fa-location-arrow" style="transform:rotate(45deg);"></i>';
                statusMessage.textContent = '🔒 North Lock ON';
                if (map) map.easeTo({ bearing: 0, pitch: 65, duration: 800 });
            } else {
                headingLockBtn.classList.remove('active');
                headingLockBtn.innerHTML = '<i class="fas fa-location-arrow"></i>';
                statusMessage.textContent = '🔄 360° Heading ON';
            }
            setTimeout(() => { statusMessage.textContent = isRecording ? '🔴 Recording' : '✅ Ready'; }, 1500);
        }

        // ===== GUIDANCE UI WITH VOICE =====
        function showGuidance(icon, text, detail) {
            guidanceIcon.textContent = icon;
            guidanceText.textContent = text;
            guidanceDetail.textContent = detail;
            guidanceEl.classList.add('show');
            if (guidanceTimeout) clearTimeout(guidanceTimeout);
            guidanceTimeout = setTimeout(() => guidanceEl.classList.remove('show'), 5000);
        }

        function showSpeedCamera(speed) {
            cameraSpeed.textContent = speed;
            cameraWarning.style.display = 'block';
            if (cameraWarningTimeout) clearTimeout(cameraWarningTimeout);
            cameraWarningTimeout = setTimeout(() => {
                cameraWarning.style.display = 'none';
            }, 3000);
            speakGuidance(`Speed camera ahead, limit ${speed} kilometers per hour`);
        }

        function getTurnIcon(modifier) {
            if (!modifier) return '⬆️';
            const m = modifier.toLowerCase();
            if (m.includes('left') && m.includes('sharp')) return '↰';
            if (m.includes('left')) return '⬅️';
            if (m.includes('right') && m.includes('sharp')) return '↱';
            if (m.includes('right')) return '➡️';
            if (m.includes('straight') || m.includes('ahead')) return '⬆️';
            if (m.includes('slight left')) return '↖️';
            if (m.includes('slight right')) return '↗️';
            if (m.includes('u-turn') || m.includes('uturn')) return '↩️';
            return '⬆️';
        }

        function getTurnText(modifier) {
            if (!modifier) return 'Proceed straight';
            const m = modifier.toLowerCase();
            if (m.includes('left') && m.includes('sharp')) return 'Sharp left';
            if (m.includes('left')) return 'Turn left';
            if (m.includes('right') && m.includes('sharp')) return 'Sharp right';
            if (m.includes('right')) return 'Turn right';
            if (m.includes('straight') || m.includes('ahead')) return 'Go straight';
            if (m.includes('slight left')) return 'Slight left';
            if (m.includes('slight right')) return 'Slight right';
            if (m.includes('u-turn') || m.includes('uturn')) return 'Make U-turn';
            return 'Proceed';
        }

        function speakTurnInstruction(step, distance) {
            if (!step || !step.maneuver) return;
            const modifier = step.maneuver.modifier || 'straight';
            const turnText = getTurnText(modifier);
            const roadName = step.name || 'the road';
            let distText = '';
            if (distance > 0) {
                if (distance < 50) distText = 'now';
                else if (distance < 100) distText = 'in about 50 meters';
                else if (distance < 200) distText = 'in about 100 meters';
                else if (distance < 400) distText = 'in about 300 meters';
                else if (distance < 700) distText = 'in about 500 meters';
                else distText = `in ${Math.round(distance)} meters`;
            }
            const fullText = `${turnText} ${distText} onto ${roadName}`;
            speakGuidance(fullText);
            const icon = getTurnIcon(modifier);
            showGuidance(icon, turnText, distText ? ` ${distText} onto ${roadName}` : `onto ${roadName}`);
        }

        // ===== SMART SEARCH / AUTOCOMPLETE =====
        let currentSearchQuery = '';
        let isSearching = false;

        function handleSearchInputDebounced(e) {
            const q = e.target.value.trim();
            currentSearchQuery = q;
            
            if (searchTimeout) clearTimeout(searchTimeout);
            
            if (q.length < 2) {
                autocompleteDropdown.style.display = 'none';
                return;
            }
            
            searchTimeout = setTimeout(() => {
                fetchSmartSuggestions(q);
            }, 300);
        }

        async function fetchSmartSuggestions(q) {
            if (isSearching) return;
            isSearching = true;

            try {
                // Use Nominatim with country bias for Kenya
                // This gives more relevant results for Kenyan locations
                const url = `/api/proxy/geocode/?q=${encodeURIComponent(q)}&limit=8&viewbox=${currentLng-0.5},${currentLat+0.5},${currentLng+0.5},${currentLat-0.5}&countrycodes=ke`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    autocompleteDropdown.innerHTML = `
                        <div class="suggestion-item" style="justify-content:center;color:#666;padding:12px;">
                            <span>No results found for "${q}"</span>
                        </div>
                    `;
                    autocompleteDropdown.style.display = 'block';
                    isSearching = false;
                    return;
                }

                // Process and display results with categories
                autocompleteDropdown.innerHTML = '';
                data.forEach(item => {
                    const lat = parseFloat(item.lat);
                    const lon = parseFloat(item.lon);
                    const dist = getHaversineDistance(currentLat, currentLng, lat, lon);
                    
                    // Determine place type
                    let placeType = '📍';
                    let typeLabel = '';
                    if (item.type) {
                        const typeMap = {
                            'building': '🏢 Building',
                            'house': '🏠 House',
                            'shop': '🛒 Shop',
                            'restaurant': '🍽️ Restaurant',
                            'cafe': '☕ Cafe',
                            'hotel': '🏨 Hotel',
                            'school': '🏫 School',
                            'hospital': '🏥 Hospital',
                            'church': '⛪ Church',
                            'mosque': '🕌 Mosque',
                            'park': '🌳 Park',
                            'road': '🛣️ Road',
                            'street': '🚦 Street',
                            'suburb': '🏘️ Suburb',
                            'village': '🏡 Village',
                            'town': '🏙️ Town',
                            'city': '🌆 City',
                            'county': '🏛️ County',
                            'state': '🏛️ State'
                        };
                        typeLabel = typeMap[item.type] || item.type;
                    }
                    
                    // Get short name
                    const displayName = item.display_name || '';
                    const parts = displayName.split(',');
                    const name = parts[0] || displayName;
                    const address = parts.slice(1, 4).join(',').trim();

                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `
                        <div class="main">
                            <span class="name">${name}</span>
                            <span class="address">${address || displayName}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;">
                            ${typeLabel ? `<span class="type">${typeLabel}</span>` : ''}
                            <span class="dist">${dist.toFixed(1)} km</span>
                        </div>
                    `;

                    div.onclick = () => {
                        destinationInput.value = displayName;
                        autocompleteDropdown.style.display = 'none';
                        calculateDirectionsTo(lat, lon, displayName);
                    };

                    autocompleteDropdown.appendChild(div);
                });

                // Add "Go to current location" option
                const currentLocDiv = document.createElement('div');
                currentLocDiv.className = 'suggestion-item';
                currentLocDiv.style.borderTop = '1px solid rgba(255,255,255,0.05)';
                currentLocDiv.style.marginTop = '4px';
                currentLocDiv.innerHTML = `
                    <div class="main">
                        <span class="name" style="color:#34c759;">📍 Current Location</span>
                        <span class="address">Go to your current position</span>
                    </div>
                    <span class="type" style="background:rgba(52,199,89,0.15);color:#34c759;">GPS</span>
                `;
                currentLocDiv.onclick = () => {
                    destinationInput.value = 'Current Location';
                    autocompleteDropdown.style.display = 'none';
                    // Use current location
                    calculateDirectionsTo(currentLat, currentLng, 'Current Location');
                };
                autocompleteDropdown.appendChild(currentLocDiv);

                autocompleteDropdown.style.display = 'block';

            } catch (error) {
                console.error('Search error:', error);
                autocompleteDropdown.innerHTML = `
                    <div class="suggestion-item" style="justify-content:center;color:#f87171;padding:12px;">
                        <span>⚠️ Search error. Please try again.</span>
                    </div>
                `;
                autocompleteDropdown.style.display = 'block';
            }

            isSearching = false;
        }

        // ===== CALCULATE DIRECTIONS =====
        async function calculateDirections() {
            const q = destinationInput.value.trim();
            if (!q) return;
            await calculateDirectionsTo(null, null, q);
        }

        async function calculateDirectionsTo(lat, lng, name) {
            autocompleteDropdown.style.display = 'none';
            directionsOverlay.style.display = 'block';
            directionsOverlay.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Finding route...`;

            try {
                let destLat, destLng, destName;

                if (lat && lng) {
                    destLat = lat;
                    destLng = lng;
                    destName = name;
                } else {
                    const geoRes = await fetch(`/api/proxy/geocode/?q=${encodeURIComponent(name)}&limit=1&countrycodes=ke`);
                    const geoData = await geoRes.json();
                    if (!geoData || !geoData.length) {
                        directionsOverlay.innerHTML = '❌ Location not found';
                        return;
                    }
                    destLat = parseFloat(geoData[0].lat);
                    destLng = parseFloat(geoData[0].lon);
                    destName = geoData[0].display_name || name;
                }

                const osrm = await fetch(`/api/proxy/route/?coordinates=${currentLng},${currentLat};${destLng},${destLat}&overview=full&geometries=geojson&steps=true`);
                const routeData = await osrm.json();
                
                if (!routeData.routes || !routeData.routes.length) {
                    directionsOverlay.innerHTML = '🚫 No route found';
                    return;
                }

                const route = routeData.routes[0];
                const routeGeo = route.geometry;
                routeSteps = route.legs[0].steps || [];
                currentStepIndex = 0;
                lastSpokenStepIndex = -1;
                
                const distance = (route.distance / 1000).toFixed(1);
                const duration = (route.duration / 60).toFixed(0);
                
                // Set speed limit based on route
                const avgSpeed = route.duration > 0 ? (route.distance / route.duration) * 3.6 : 50;
                currentSpeedLimit = Math.min(120, Math.max(30, Math.round(avgSpeed * 1.1 / 5) * 5));
                speedLimitSign.textContent = currentSpeedLimit;
                
                if (routeSteps.length > 0) {
                    const firstStep = routeSteps[0];
                    if (firstStep.maneuver) {
                        const dist = firstStep.distance || 0;
                        speakTurnInstruction(firstStep, dist);
                    }
                }
                
                if (map && map.getSource('route')) {
                    map.getSource('route').setData({ type:'Feature', geometry:routeGeo });
                }
                
                const coords = routeGeo.coordinates;
                if (coords && coords.length && map) {
                    const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
                    map.fitBounds(bounds, { padding: 40, duration: 1200, pitch: 60 });
                }
                
                // Add destination marker
                const destEl = document.createElement('div');
                destEl.style.cssText = 'background:#ff3b30;width:14px;height:14px;border-radius:50%;border:2.5px solid white;box-shadow:0 0 25px rgba(255,59,48,0.5);';
                if (map) new maplibregl.Marker({ element: destEl }).setLngLat([destLng, destLat]).addTo(map);
                
                directionsOverlay.innerHTML = `📍 ${distance} km • ${duration} min to ${destName.split(',').slice(0,2).join(',')}`;
                setTimeout(() => {
                    if (routeSteps.length) {
                        const step = routeSteps[0];
                        directionsOverlay.innerHTML = `<i class="fas ${getDirectionIcon(step.maneuver.modifier)}" style="color:#6366f1;margin-right:6px;"></i> ${getReadableInstruction(step)}`;
                    }
                }, 3000);

            } catch(e) {
                console.error('Routing error:', e);
                directionsOverlay.innerHTML = '⚠️ Routing error - try again';
            }
        }

        // ===== GPS WITH HEADING TRACKING =====
        function startLocationTracking() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            lastGpsTime = null; lastLat = null; lastLng = null;
            const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 };

            function successCallback(position) {
                const { latitude, longitude, speed, heading, accuracy } = position.coords;
                let speedKmh = 0;
                const now = Date.now();
                
                if (speed !== null && speed !== undefined) {
                    speedKmh = speed * 3.6;
                } else if (lastLat !== null && lastLng !== null && lastGpsTime) {
                    const seconds = (now - lastGpsTime) / 1000;
                    if (seconds > 0.5) {
                        const R = 6371;
                        const dLat = (latitude - lastLat) * Math.PI / 180;
                        const dLng = (longitude - lastLng) * Math.PI / 180;
                        const a = Math.sin(dLat/2)**2 + Math.cos(lastLat*Math.PI/180)*Math.cos(latitude*Math.PI/180)*Math.sin(dLng/2)**2;
                        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                        speedKmh = ((R * c) / seconds) * 3600;
                        if (speedKmh < 1.0) speedKmh = 0;
                    }
                }
                
                let deviceHeading = heading;
                if (deviceHeading === null || deviceHeading === undefined) {
                    if (lastLat !== null && lastLng !== null) {
                        const dy = latitude - lastLat;
                        const dx = longitude - lastLng;
                        if (Math.abs(dx) > 0.000001 || Math.abs(dy) > 0.000001) {
                            deviceHeading = Math.atan2(dx, dy) * (180 / Math.PI);
                            if (deviceHeading < 0) deviceHeading += 360;
                        }
                    }
                }
                
                currentLat = latitude;
                currentLng = longitude;
                currentSpeed = speedKmh;
                if (deviceHeading !== null && deviceHeading !== undefined) {
                    currentHeading = deviceHeading;
                }
                
                lastLat = latitude;
                lastLng = longitude;
                lastGpsTime = now;
                
                updateSpeedometer(speedKmh);
                gpsDisplay.innerHTML = `Lat: ${latitude.toFixed(6)}<br>Lng: ${longitude.toFixed(6)}`;
                updateMapPosition(latitude, longitude, currentHeading);

                // Store route points
                routePoints.push([latitude, longitude]);
                if (map && map.getSource('route')) {
                    const coords = routePoints.map(p => [p[1], p[0]]);
                    map.getSource('route').setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }

                speedCameras.forEach(cam => {
                    const dist = getHaversineDistance(latitude, longitude, cam.lat, cam.lng) * 1000;
                    if (dist < 80 && speedKmh > cam.speed) {
                        showSpeedCamera(cam.speed);
                    }
                });

                if (routeSteps && routeSteps.length > 0 && currentStepIndex < routeSteps.length) {
                    const nextStep = routeSteps[currentStepIndex];
                    if (nextStep && nextStep.maneuver && nextStep.maneuver.location) {
                        const stepLon = nextStep.maneuver.location[0];
                        const stepLat = nextStep.maneuver.location[1];
                        const distToStep = getHaversineDistance(latitude, longitude, stepLat, stepLon) * 1000;
                        
                        if (distToStep < 300 && distToStep > 10 && currentStepIndex !== lastSpokenStepIndex) {
                            speakTurnInstruction(nextStep, distToStep);
                            lastSpokenStepIndex = currentStepIndex;
                        }
                        
                        if (distToStep < 30 && currentStepIndex < routeSteps.length - 1) {
                            currentStepIndex++;
                            if (currentStepIndex < routeSteps.length) lastSpokenStepIndex = -1;
                        }
                    }
                    
                    const activeStep = routeSteps[currentStepIndex] || routeSteps[routeSteps.length - 1];
                    if (activeStep) {
                        const iconClass = getDirectionIcon(activeStep.maneuver ? activeStep.maneuver.modifier : null);
                        const instructionText = getReadableInstruction(activeStep);
                        directionsOverlay.innerHTML = `<i class="fas ${iconClass}" style="color:#6366f1;margin-right:6px;"></i> ${instructionText}`;
                        directionsOverlay.style.display = 'block';
                    }
                }
                sendGPSData(latitude, longitude, speedKmh, currentHeading);
            }

            function errorCallback(error) {
                console.error('GPS error:', error);
                statusMessage.textContent = '⚠️ GPS lost';
                setTimeout(() => {
                    if (!isRecording) statusMessage.textContent = '✅ Ready';
                }, 3000);
            }

            watchId = navigator.geolocation.watchPosition(successCallback, errorCallback, options);
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getReadableInstruction(step) {
            if (!step || !step.maneuver) return "Proceed";
            const type = step.maneuver.type;
            const modifier = step.maneuver.modifier || "";
            const name = step.name || "road";
            const dist = step.distance || 0;
            if (type === "depart") return `Head ${modifier} on ${name}`;
            if (type === "arrive") return `Arrive at ${name}`;
            let action = `${type} ${modifier}`.trim();
            return `${action} on ${name} (${dist.toFixed(0)}m)`;
        }

        function getDirectionIcon(modifier) {
            if (!modifier) return "fa-arrow-up";
            const m = modifier.toLowerCase();
            if (m.includes("left")) return "fa-arrow-left";
            if (m.includes("right")) return "fa-arrow-right";
            return "fa-arrow-up";
        }

        function sendGPSData(lat, lng, speed, heading) {
            if (ws && ws.readyState === WebSocket.OPEN && recordingId) {
                ws.send(JSON.stringify({ 
                    type:'gps_data', 
                    recording_id:recordingId, 
                    timestamp:new Date().toISOString(), 
                    latitude:lat, 
                    longitude:lng, 
                    speed:speed, 
                    heading:heading||0 
                }));
            }
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws/video/`;
            try {
                ws = new WebSocket(wsUrl);
                ws.onopen = () => { 
                    connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#34c759;font-size:8px;"></i> Online'; 
                    statusMessage.textContent='✅ Ready'; 
                };
                ws.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'video_frame' && data.detections) { 
                            liveYoloDetections = data.detections; 
                            lastDetectionTime = Date.now(); 
                        }
                        if (data.type === 'set_vehicle_plate') { 
                            currentPlate = data.plate.toUpperCase(); 
                            localStorage.setItem('dashcam_plate', currentPlate); 
                        }
                        if (data.type === 'location_update') {
                            if (data.latitude && data.longitude) {
                                const lat = parseFloat(data.latitude);
                                const lng = parseFloat(data.longitude);
                                const heading = data.heading ? parseFloat(data.heading) : null;
                                routePoints.push([lat, lng]);
                                updateMapPosition(lat, lng, heading);
                            }
                        }
                    } catch(err) {}
                };
                ws.onclose = () => { 
                    connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ff3b30;font-size:8px;"></i> Offline'; 
                    setTimeout(connectWebSocket, 3000); 
                };
                ws.onerror = () => { 
                    connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ff9500;font-size:8px;"></i> Error'; 
                };
            } catch(e) {
                console.warn('WebSocket unavailable');
                connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ff9500;font-size:8px;"></i> Local';
            }
        }

        // ===== OSD =====
        function startOSDDrawLoop() {
            const rect = liveCanvas.parentElement.getBoundingClientRect();
            const containerWidth = rect.width;
            const containerHeight = rect.height;
            
            const aspectRatio = 16/9;
            let canvasWidth = containerWidth;
            let canvasHeight = containerWidth / aspectRatio;
            
            if (canvasHeight > containerHeight) {
                canvasHeight = containerHeight;
                canvasWidth = containerHeight * aspectRatio;
            }
            
            const scale = 1.5;
            liveCanvas.width = canvasWidth * scale * 2;
            liveCanvas.height = canvasHeight * scale * 2;
            liveCanvas.style.width = canvasWidth + 'px';
            liveCanvas.style.height = canvasHeight + 'px';
            
            if (osdInterval) clearInterval(osdInterval);
            
            let frameCount = 0;
            
            osdInterval = setInterval(() => {
                frameCount++;
                if (frameCount % 3 !== 0 && isRecording) {
                    return;
                }
                
                const ctx = osdCtx;
                const w = liveCanvas.width;
                const h = liveCanvas.height;
                
                ctx.clearRect(0, 0, w, h);
                
                if (video.videoWidth && video.readyState >= 2) {
                    const vw = video.videoWidth;
                    const vh = video.videoHeight;
                    const vidAspect = vw / vh;
                    const canvasAspect = w / h;
                    
                    let dw, dh, dx, dy;
                    if (vidAspect > canvasAspect) {
                        dh = h;
                        dw = h * vidAspect;
                        dx = (w - dw) / 2;
                        dy = 0;
                    } else {
                        dw = w;
                        dh = w / vidAspect;
                        dx = 0;
                        dy = (h - dh) / 2;
                    }
                    
                    ctx.drawImage(video, dx, dy, dw, dh);
                } else {
                    ctx.fillStyle = '#080b16';
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.font = `${Math.round(w * 0.025)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('📹 CAMERA', w/2, h/2);
                }
                
                if (liveYoloDetections && liveYoloDetections.length && (Date.now()-lastDetectionTime<1500)) {
                    const scaleX = w / 640;
                    const scaleY = h / 360;
                    liveYoloDetections.forEach(det => {
                        if (!det.bbox) return;
                        const [x1,y1,x2,y2] = det.bbox;
                        const rx1 = x1 * scaleX;
                        const ry1 = y1 * scaleY;
                        const rw = (x2-x1) * scaleX;
                        const rh = (y2-y1) * scaleY;
                        ctx.strokeStyle = '#00ff88';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#00ff88';
                        ctx.shadowBlur = 10;
                        ctx.strokeRect(rx1, ry1, rw, rh);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#00ff88';
                        ctx.font = `bold ${Math.round(w * 0.018)}px monospace`;
                        ctx.fillText(`${det.class||'obj'} ${((det.confidence||0)*100).toFixed(0)}%`, rx1, ry1-8);
                    });
                }
                
                const barHeight = Math.round(h * 0.07);
                const barY = h - barHeight;
                
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, barY, w, barHeight);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, barY);
                ctx.lineTo(w, barY);
                ctx.stroke();
                
                const fontSize = Math.round(w * 0.022);
                ctx.font = `${fontSize}px monospace`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                
                const leftMargin = Math.round(w * 0.02);
                const rightMargin = Math.round(w * 0.02);
                const centerX = w / 2;
                const barCenterY = barY + (barHeight / 2);
                
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
                const dateStr = now.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit' 
                });
                ctx.fillStyle = '#e2e8f0';
                ctx.textAlign = 'left';
                ctx.fillText(`${dateStr} ${timeStr}`, leftMargin, barCenterY);
                
                if (isRecording && recordingStartTime) {
                    const duration = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const mins = String(Math.floor(duration / 60)).padStart(2, '0');
                    const secs = String(duration % 60).padStart(2, '0');
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#ff3b30';
                    ctx.font = `bold ${fontSize}px monospace`;
                    ctx.fillText(`● ${mins}:${secs}`, centerX, barCenterY);
                    ctx.font = `${fontSize}px monospace`;
                } else {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText('● STANDBY', centerX, barCenterY);
                }
                
                const rightSectionStart = w - rightMargin;
                ctx.textAlign = 'right';
                
                ctx.fillStyle = '#00ff88';
                ctx.font = `bold ${Math.round(fontSize * 1.3)}px monospace`;
                const speedText = `${Math.round(currentSpeed)} km/h`;
                ctx.fillText(speedText, rightSectionStart, barCenterY - 6);
                
                ctx.fillStyle = '#e2e8f0';
                ctx.font = `${Math.round(fontSize * 0.9)}px monospace`;
                const gpsText = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
                ctx.fillText(gpsText, rightSectionStart, barCenterY + 16);
                
                ctx.font = `${fontSize}px monospace`;
                ctx.textBaseline = 'alphabetic';
                
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                const watermarkW = Math.round(w * 0.18);
                const watermarkH = Math.round(h * 0.045);
                const watermarkX = w - watermarkW - Math.round(w * 0.01);
                const watermarkY = Math.round(h * 0.015);
                ctx.fillRect(watermarkX, watermarkY, watermarkW, watermarkH);
                
                ctx.fillStyle = '#ff9500';
                ctx.font = `bold ${Math.round(w * 0.022)}px Arial`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText('REAGANTECH', w - Math.round(w * 0.02), watermarkY + (watermarkH / 2));
                ctx.textBaseline = 'alphabetic';
                
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                const plateW = Math.round(w * 0.18);
                const plateH = Math.round(h * 0.04);
                const plateX = leftMargin;
                const plateY = barY - plateH - 6;
                ctx.fillRect(plateX, plateY, plateW, plateH);
                
                ctx.fillStyle = '#ff9500';
                ctx.font = `bold ${Math.round(w * 0.018)}px monospace`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`🚗 ${currentPlate}`, plateX + 6, plateY + plateH - 4);
                ctx.textBaseline = 'alphabetic';
                
                if (frameCount % 2 === 0) {
                    ctx.strokeStyle = 'rgba(0,255,136,0.03)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    const sweepPos = sweepY * (h / 720);
                    ctx.moveTo(0, sweepPos);
                    ctx.lineTo(w, sweepPos);
                    ctx.stroke();
                    sweepY += sweepDirection;
                    if (sweepY > 680 || sweepY < 40) sweepDirection *= -1;
                }
                
            }, 66);
        }

        // ===== RECORDING =====
        async function toggleRecording() {
            if (isRecording) { await stopRecording(); } else { await startRecording(); }
        }

        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920, min: 1280 },
                        height: { ideal: 1080, min: 720 },
                        facingMode: 'environment',
                        frameRate: { ideal: 30, max: 30 }
                    }, 
                    audio: true 
                });
                video.srcObject = mediaStream;
                await createRecordingSession();
                isRecording = true;
                recordingStartTime = Date.now();
                totalRecordedSize = 0;
                
                if (!watchId) {
                    startLocationTracking();
                }
                startOSDDrawLoop();
                
                startVoiceRecognition();
                
                recordingOverlay.classList.add('active');
                storageIndicator.classList.add('active');
                
                if (storageUpdateInterval) clearInterval(storageUpdateInterval);
                storageUpdateInterval = setInterval(updateStorageInfo, 1000);
                
                recordedChunks = [];
                const canvasStream = liveCanvas.captureStream(15);
                const combined = new MediaStream();
                combined.addTrack(canvasStream.getVideoTracks()[0]);
                if (mediaStream.getAudioTracks().length) combined.addTrack(mediaStream.getAudioTracks()[0]);
                
                let mime = 'video/mp4;codecs=h264';
                if (!MediaRecorder.isTypeSupported(mime)) { 
                    mime='video/webm;codecs=h264'; 
                    recExtension='webm'; 
                    if(!MediaRecorder.isTypeSupported(mime)){ 
                        mime='video/webm'; 
                        recExtension='webm'; 
                    } 
                }
                mediaRecorder = new MediaRecorder(combined, { 
                    mimeType: mime, 
                    videoBitsPerSecond: 8000000
                });
                mediaRecorder.ondataavailable = e => { 
                    if(e.data.size) {
                        recordedChunks.push(e.data);
                        totalRecordedSize += e.data.size;
                    }
                };
                mediaRecorder.start(1000);
                
                if(frameInterval) clearInterval(frameInterval);
                sendLightweightPreviews();
                
                recordBtn.innerHTML = '<i class="fas fa-dot-circle"></i>'; 
                recordBtn.className='control-btn btn-start active';
                recordingStatus.textContent='REC'; 
                recordingDot.className='recording-dot active'; 
                stopBtn.disabled=false;
                statusMessage.textContent='🔴 Recording';
                
            } catch(e) {
                statusMessage.textContent='⚠️ Camera error';
                alert('Please allow camera and microphone access.');
                console.error(e);
            }
        }

        async function createRecordingSession() {
            try {
                const response = await fetch('/api/recordings/videos/', { 
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({ 
                        driver:1, 
                        vehicle_registration:currentPlate, 
                        start_time:new Date().toISOString(), 
                        start_latitude:currentLat, 
                        start_longitude:currentLng, 
                        is_emergency:false 
                    }) 
                });
                const data = await response.json(); 
                recordingId = data.id;
            } catch(e) { 
                recordingId = 'local_' + Date.now(); 
            }
        }

        function sendLightweightPreviews() {
            const previewCanvas = document.createElement('canvas');
            const pctx = previewCanvas.getContext('2d');
            previewCanvas.width = 320; previewCanvas.height = 180;
            frameInterval = setInterval(() => {
                if(!isRecording || !liveCanvas.width) return;
                try {
                    pctx.drawImage(liveCanvas, 0, 0, 320, 180);
                    const baseFrame = previewCanvas.toDataURL('image/jpeg', 0.3);
                    if(ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ 
                            type:'video_frame', 
                            frame:baseFrame, 
                            timestamp:new Date().toISOString() 
                        }));
                    }
                } catch(e) {}
            }, 1000);
        }

        async function stopRecording() {
            if(!isRecording) return;
            isRecording = false;
            statusMessage.textContent='💾 Saving...';
            
            recordingOverlay.classList.remove('active');
            storageIndicator.classList.remove('active');
            if (storageUpdateInterval) {
                clearInterval(storageUpdateInterval);
                storageUpdateInterval = null;
            }
            
            stopVoiceRecognition();
            
            if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if(frameInterval) clearInterval(frameInterval);
            if(osdInterval) clearInterval(osdInterval);
            if(watchId) { 
                navigator.geolocation.clearWatch(watchId); 
                watchId = null; 
            }
            if(mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
            video.srcObject = null;
            
            currentSpeed = 0;
            updateSpeedometer(0);
            
            setTimeout(() => {
                if(recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder ? mediaRecorder.mimeType : 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); 
                    a.href=url; 
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                    a.download=`dashcam_${timestamp}.${recExtension}`; 
                    document.body.appendChild(a); 
                    a.click(); 
                    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
                    
                    if(recordingId && typeof recordingId === 'number') {
                        const fd = new FormData(); 
                        fd.append('video_file', blob, `recording.${recExtension}`); 
                        fd.append('end_time', new Date().toISOString());
                        fd.append('duration', Math.floor((Date.now() - recordingStartTime) / 1000));
                        fetch(`/api/recordings/videos/${recordingId}/`, { method:'PATCH', body:fd }).catch(()=>{});
                    }
                    
                    statusMessage.textContent = `✅ Saved ${(totalRecordedSize / (1024*1024)).toFixed(1)} MB`;
                    setTimeout(() => {
                        if (!isRecording) statusMessage.textContent = '✅ Ready';
                    }, 3000);
                } else {
                    statusMessage.textContent = '⚠️ No data recorded';
                }
                
                recordBtn.innerHTML='<i class="fas fa-video"></i>'; 
                recordBtn.className='control-btn btn-start';
                recordingStatus.textContent='STANDBY'; 
                recordingDot.className='recording-dot'; 
                stopBtn.disabled=true;
                recordingId=null; 
                mediaRecorder=null;
                recordingStartTime = null;
                voiceHeardText.textContent = '🎤 Say "SAVE"';
            }, 500);
        }

        // ===== EMERGENCY =====
        async function triggerEmergency() {
            emergencyIndicator.style.display='block'; 
            statusMessage.textContent='🚨 SOS TRIGGERED';
            if(recordingId && typeof recordingId === 'number') {
                try{ 
                    await fetch(`/api/recordings/videos/${recordingId}/add_emergency/`, { 
                        method:'POST', 
                        headers:{'Content-Type':'application/json'}, 
                        body:JSON.stringify({ 
                            latitude:currentLat, 
                            longitude:currentLng, 
                            speed_kmh:currentSpeed, 
                            description:'Voice activated emergency' 
                        }) 
                    }); 
                } catch(e){}
            }
            if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
            setTimeout(()=>{ emergencyIndicator.style.display='none'; }, 4000);
        }

        // ===== INIT =====
        statusMessage.textContent = '🚗 Loading...';
        
        buildSpeedometer();
        initMap();
        startOSDDrawLoop();
        connectWebSocket();
        startLocationTracking();
        
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (window.SpeechRecognition) {
            voiceHeardText.textContent = '🎤 Say "SAVE"';
        } else {
            voiceHeardText.textContent = '🔇 Voice unavailable';
        }

        window.addEventListener('resize', () => {
            if (isRecording) startOSDDrawLoop();
        });

        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // Click outside to close dropdown
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.map-search-control')) {
                autocompleteDropdown.style.display = 'none';
            }
        });

        // ===== CONTROLS - ONLY ON DOUBLE CLICK =====
        let lastTapTime = 0;
        let tapTimeout = null;
        const phoneFrame = document.querySelector('.phone-frame');

        phoneFrame.addEventListener('touchend', (e) => {
            if (e.target.closest('.control-btn') || e.target.closest('.back-link') || 
                e.target.closest('#heading-lock-btn') || e.target.closest('.map-search-control') ||
                e.target.closest('#controls-bar')) {
                return;
            }
            
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0) {
                e.preventDefault();
                toggleControls();
                lastTapTime = 0;
                clearTimeout(tapTimeout);
            } else {
                lastTapTime = currentTime;
                clearTimeout(tapTimeout);
                tapTimeout = setTimeout(() => {
                    lastTapTime = 0;
                }, 400);
            }
        });

        phoneFrame.addEventListener('dblclick', (e) => {
            if (e.target.closest('.control-btn') || e.target.closest('.back-link') || 
                e.target.closest('#heading-lock-btn') || e.target.closest('.map-search-control') ||
                e.target.closest('#controls-bar')) {
                return;
            }
            toggleControls();
        });

        hideControls();
    </script>
</body>
</html>
